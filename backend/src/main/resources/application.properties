spring.application.name=orion-backend

server.port=8080

orion.security.jwt.private-key=classpath:keys/private.pem
orion.security.jwt.public-key=classpath:keys/public.pem
orion.security.jwt.issuer=orion-api
orion.security.jwt.expiration-seconds=3600

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/orion
spring.datasource.username=orion
spring.datasource.password=orion
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true